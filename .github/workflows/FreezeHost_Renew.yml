name: FreezeHost 续期

# 注意: GITHUB_TOKEN 的 permissions 键不支持 workflows 作用域, 无法修改 workflow 文件。
# 因此 cron 固定为每天一次, 由 renew.py 自行判断: 剩余 <=7 天才执行续期(重置为14天),
# >7 天为冷却期直接跳过, 不会重复扣币。每次运行追加记录到 state/renew_history.txt
# 保持仓库活跃(避开 GitHub 60 天无提交导致定时 workflow 被停用)。
permissions:
  contents: write

on:
  schedule:
    - cron: '44 1 * * *'   # FREEZEHOST_DISCORD_TOKEN_1 - 每天固定
    - cron: '37 2 * * *'   # FREEZEHOST_DISCORD_TOKEN_2 - 每天固定
    - cron: '15 3 * * *'   # FREEZEHOST_DISCORD_TOKEN_3 - 每天固定
    - cron: '20 4 * * *'   # FREEZEHOST_DISCORD_TOKEN_4 - 每天固定
    - cron: '25 5 * * *'   # FREEZEHOST_DISCORD_TOKEN_5 - 每天固定
  workflow_dispatch:
    inputs:
      token_number:
        description: '选择 Token 编号'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: 确定使用哪个 Token
        id: select_token
        run: |
          HOUR=$(date -u +%H)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOKEN_NUM="${{ github.event.inputs.token_number }}"
          else
            case "$HOUR" in
              01) TOKEN_NUM=1 ;;
              02) TOKEN_NUM=2 ;;
              03) TOKEN_NUM=3 ;;
              04) TOKEN_NUM=4 ;;
              05) TOKEN_NUM=5 ;;
              *) TOKEN_NUM=1 ;;
            esac
          fi

          echo "token_number=$TOKEN_NUM" >> "$GITHUB_OUTPUT"
          echo "::notice::选择 Token 编号: $TOKEN_NUM"

      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          # 安装真正的 Google Chrome (不是 Playwright 自带的 chromium)
          # 因为 chromium 即便 headless=False 也会发 HeadlessChrome UA, 被 FreezeHost 检测
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

          pip install playwright
          playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y jq bc xvfb

      - name: 设置代理 (sing-box, 复用 katabump 同款脚本)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.PROXY_URL }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 修复 DNS & 验证出口 IP
        run: |
          echo "[INFO] 停用 systemd-resolved，直连 DNS..."

          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true

          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf

          sudo chattr +i /etc/resolv.conf 2>/dev/null || true
          sleep 2

          echo "[INFO] DNS 测试:"
          nslookup free.freezehost.pro 1.1.1.1 || echo "[WARN] 解析失败"

          echo ""
          if [ "${IS_PROXY}" = "true" ]; then
            echo "[INFO] 当前出口 IP (通过 sing-box 代理 ${PROXY_SERVER}):"
            curl -x "$PROXY_SERVER" -s --max-time 10 https://api.ipify.org && echo
          else
            echo "[INFO] 当前出口 IP (GitHub Actions 原生):"
            curl -s --max-time 10 https://api.ipify.org && echo
            echo "[WARN] 未启用代理, FreezeHost 可能会拉黑"
          fi

      - name: 设置 Discord Token
        run: |
          TOKEN_NUM="${{ steps.select_token.outputs.token_number }}"

          case "$TOKEN_NUM" in
            1) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
            2) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_2 }}" >> "$GITHUB_ENV" ;;
            3) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_3 }}" >> "$GITHUB_ENV" ;;
            4) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_4 }}" >> "$GITHUB_ENV" ;;
            5) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_5 }}" >> "$GITHUB_ENV" ;;
            *) echo "DISCORD_TOKEN=${{ secrets.FREEZEHOST_DISCORD_TOKEN_1 }}" >> "$GITHUB_ENV" ;;
          esac

          echo "::notice::已设置 Token 编号: $TOKEN_NUM"

      - name: 运行续期脚本
        id: run_renew
        env:
          FREEZEHOST_DISCORD_TOKEN: ${{ env.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TOKEN_NUM: ${{ steps.select_token.outputs.token_number }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          echo "使用 Token 编号: ${{ steps.select_token.outputs.token_number }}"
          echo "代理状态: IS_PROXY=${IS_PROXY:-false}, PROXY_SERVER=${PROXY_SERVER:-无}"
          # 用 xvfb-run 提供虚拟显示器, 让 headless=False 的 Chromium 能跑
          # 否则 FreezeHost 会检测到 headless 模式并永久封禁 IP+账号
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py 2>&1 | tee renew.log

      - name: 记录运行状态 (审计 + 保持仓库活跃)
        if: always()
        run: |
          set -e
          TOKEN_NUM="${{ steps.select_token.outputs.token_number }}"

          REMAINING="?"
          if [ -f "renew.log" ]; then
            REMAINING=$(grep -iE "续期状态: .* DAYS? AND .* HOURS? REMAINING" renew.log \
              | head -1 | grep -oiP '\d+(?=\s*DAYS?)' || echo "?")
          fi
          [ -z "$REMAINING" ] && REMAINING="?"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p state
          LINE="$(date -u '+%Y-%m-%d %H:%M') | token=$TOKEN_NUM | remaining=${REMAINING}d | job=${{ job.status }}"
          echo "$LINE" >> state/renew_history.txt
          tail -n 300 state/renew_history.txt > state/.tmp && mv state/.tmp state/renew_history.txt

          git add state/renew_history.txt
          if git diff --cached --quiet; then
            echo "状态无变化, 跳过提交"
            exit 0
          fi
          git commit -q -m "record: token $TOKEN_NUM 运行记录" -m "$LINE"
          git pull --rebase -q origin main || true
          git push origin main 2>&1 | tail -1 || echo "::warning::状态推送失败 (下次运行会重试)"

      - name: 上传截图和HTML（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-debug-token-${{ steps.select_token.outputs.token_number }}
          path: |
            screenshots/
            renew.log
          if-no-files-found: ignore
          retention-days: 3

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
